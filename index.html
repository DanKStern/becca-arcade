<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becca's Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 24px;
    font: 20px/1.4 system-ui, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ff6fb0, #7c6bff 50%, #4fd1ff);
    color: #fff; text-align: center;
  }
  h1 {
    font-size: 54px; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }
  .sub { font-size: 20px; opacity: 0.9; margin-top: -10px; }
  .games { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
  a.tile {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: 220px; padding: 28px 16px; border-radius: 28px;
    background: rgba(255,255,255,0.18); border: 4px solid rgba(255,255,255,0.55);
    text-decoration: none; color: #fff; font-weight: 700; font-size: 24px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.12);
    transition: transform 0.12s ease;
  }
  a.tile:hover, a.tile:active { transform: translateY(-6px) scale(1.03); }
  a.tile .emo { font-size: 64px; line-height: 1; }
  a.tile .tag { font-size: 15px; font-weight: 400; opacity: 0.85; }
</style>
</head>
<body>
  <h1>🕹️ Becca's Arcade</h1>
  <div class="sub">Pick a game!</div>
  <div class="games">
    <a class="tile" href="pitch-bird.html">
      <span class="emo">🐦</span>
      <span>Pitch Bird</span>
      <span class="tag">sing to fly!</span>
    </a>
    <a class="tile" href="memory-match.html">
      <span class="emo">🧠</span>
      <span>Memory Match</span>
      <span class="tag">find the pairs</span>
    </a>
    <a class="tile" href="sound-match.html">
      <span class="emo">🔊</span>
      <span>Sound Match</span>
      <span class="tag">match the wiggle</span>
    </a>
    <a class="tile" href="takeaway-tower.html">
      <span class="emo">🧱</span>
      <span>Takeaway Tower</span>
      <span class="tag">100 minus...?</span>
    </a>
    <a class="tile" href="mirror-maker.html">
      <span class="emo">🪞</span>
      <span>Mirror Maker</span>
      <span class="tag">draw and reflect</span>
    </a>
    <a class="tile" href="mix-it-lab.html">
      <span class="emo">🎨</span>
      <span>Mix-It Lab</span>
      <span class="tag">mix the colors</span>
    </a>
  </div>
</body>
</html>
