<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Maze — Becca's Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column;
    align-items: center; gap: 14px; font: 18px/1.4 system-ui, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #5fcf6a, #4fd1ff 55%, #7c6bff);
    color: #fff; text-align: center; overflow-x: hidden;
  }
  a.back { position: absolute; top: 16px; left: 16px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; }
  h1 { margin: 6px 0 0; font-size: 36px; text-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  #status { font-size: 19px; min-height: 26px; font-weight: 600; }
  .bar { display: flex; gap: 18px; font-weight: 700; font-size: 18px; }
  .stage {
    width: min(420px, 94vw); background: rgba(255,255,255,0.14); border: 4px solid rgba(255,255,255,0.5);
    border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  #queueRow {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 40px;
    width: 100%;
  }
  .chip {
    width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.9);
    color: #333; font-size: 18px; display: flex; align-items: center; justify-content: center;
    font-weight: 800;
  }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; }
  .pad button {
    font-size: 26px; border-radius: 14px; border: 3px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.22); color: #fff; cursor: pointer;
  }
  .pad button:active { background: rgba(255,255,255,0.4); }
  #upBtn { grid-column: 2; grid-row: 1; }
  #leftBtn { grid-column: 1; grid-row: 2; }
  #downBtn { grid-column: 2; grid-row: 2; }
  #rightBtn { grid-column: 3; grid-row: 2; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .row2 button {
    font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: rgba(255,255,255,0.22);
    border: 3px solid rgba(255,255,255,0.55); border-radius: 14px; padding: 8px 16px; cursor: pointer;
  }
  .row2 button:disabled { opacity: 0.35; cursor: default; }
  .row2 #goBtn { background: #2c6e4a; border-color: #4fc283; }
  #gridWrap { position: relative; width: min(320px, 80vw); aspect-ratio: 1; }
  #grid { display: grid; width: 100%; height: 100%; gap: 3px; }
  .cell { background: rgba(255,255,255,0.18); border-radius: 6px; }
  .cell.goal { background: rgba(255,212,79,0.35); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #robot {
    position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center;
    font-size: 26px; transition: transform 0.3s ease; pointer-events: none;
  }
  #robot.bump { animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translate(var(--tx), var(--ty)); } 25% { transform: translate(calc(var(--tx) - 6px), var(--ty)); } 75% { transform: translate(calc(var(--tx) + 6px), var(--ty)); } }
  .confetti { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.4; } }
</style>
</head>
<body>
  <a class="back" href="index.html">← Arcade</a>
  <h1>🤖 Robot Maze</h1>
  <div id="status">Queue some moves, then press Go!</div>
  <div class="bar"><span>⭐ Score: <span id="score">0</span></span><span>🔥 Streak: <span id="streak">0</span></span></div>

  <div class="stage">
    <div id="queueRow"></div>
    <div class="pad">
      <button id="upBtn">⬆️</button>
      <button id="leftBtn">⬅️</button>
      <button id="downBtn">⬇️</button>
      <button id="rightBtn">➡️</button>
    </div>
    <div class="row2">
      <button id="undoBtn">⌫ Undo</button>
      <button id="clearBtn">🧹 Clear</button>
      <button id="goBtn">▶ Go!</button>
    </div>
    <div id="gridWrap">
      <div id="grid"></div>
      <div id="robot">🤖</div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const queueRow = $('#queueRow'), grid = $('#grid'), gridWrap = $('#gridWrap'), robot = $('#robot'), statusEl = $('#status');
let score = 0, streak = 0, audioCtx, master;
let size = 4, start = { r: 0, c: 0 }, goal = { r: 0, c: 0 }, pos = { r: 0, c: 0 };
let queue = [], running = false;
const MAX_QUEUE = 10;
const MOVES = {
  U: { dr: -1, dc: 0, arrow: '⬆️' },
  D: { dr: 1, dc: 0, arrow: '⬇️' },
  L: { dr: 0, dc: -1, arrow: '⬅️' },
  R: { dr: 0, dc: 1, arrow: '➡️' },
};

function playDing(ok) {
  const t0 = audioCtx.currentTime + 0.02;
  const o = audioCtx.createOscillator(); o.type = 'sine';
  o.frequency.value = ok ? 880 : 180;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (ok ? 0.4 : 0.3));
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.5);
}

function playBump() {
  const t0 = audioCtx.currentTime + 0.02;
  const o = audioCtx.createOscillator(); o.type = 'square';
  o.frequency.value = 110;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.15);
}

function burst() {
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = ['⭐','✨','🎉'][i % 3];
    c.style.left = (40 + Math.random() * 20) + 'vw';
    c.style.animationDuration = (1.4 + Math.random()) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function cellSize() { return gridWrap.clientWidth / size; }

function placeRobot(animate) {
  const cs = cellSize();
  const tx = pos.c * cs, ty = pos.r * cs;
  robot.style.width = cs + 'px'; robot.style.height = cs + 'px';
  robot.style.fontSize = Math.round(cs * 0.6) + 'px';
  robot.style.setProperty('--tx', tx + 'px');
  robot.style.setProperty('--ty', ty + 'px');
  if (!animate) robot.style.transition = 'none';
  robot.style.transform = `translate(${tx}px, ${ty}px)`;
  if (!animate) requestAnimationFrame(() => { robot.style.transition = ''; });
}

function buildGrid() {
  grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${size}, 1fr)`;
  grid.innerHTML = '';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (r === goal.r && c === goal.c ? ' goal' : '');
      if (r === goal.r && c === goal.c) cell.textContent = '🚩';
      grid.appendChild(cell);
    }
  }
  placeRobot(false);
}

function renderQueue() {
  queueRow.innerHTML = '';
  queue.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = MOVES[m].arrow;
    queueRow.appendChild(chip);
  });
}

function setControlsEnabled(on) {
  ['upBtn','downBtn','leftBtn','rightBtn','undoBtn','clearBtn','goBtn'].forEach(id => $('#' + id).disabled = !on);
  if (on) $('#goBtn').disabled = queue.length === 0;
}

function queueMove(m) {
  if (running || queue.length >= MAX_QUEUE) return;
  queue.push(m);
  renderQueue();
  setControlsEnabled(true);
}

function resetAttempt() {
  pos = { r: start.r, c: start.c };
  queue = [];
  running = false;
  renderQueue();
  placeRobot(false);
  setControlsEnabled(true);
  statusEl.textContent = 'Queue some moves, then press Go!';
}

function newRound() {
  size = Math.min(4 + Math.floor(streak / 3), 6);
  start = { r: 0, c: 0 };
  do {
    goal = { r: Math.floor(Math.random() * size), c: Math.floor(Math.random() * size) };
  } while (goal.r === start.r && goal.c === start.c);
  pos = { r: start.r, c: start.c };
  buildGrid();
  resetAttempt();
}

async function runQueue() {
  if (running || queue.length === 0) return;
  running = true;
  setControlsEnabled(false);
  for (const m of queue) {
    const { dr, dc } = MOVES[m];
    const nr = pos.r + dr, nc = pos.c + dc;
    if (nr < 0 || nr >= size || nc < 0 || nc >= size) {
      playBump();
      robot.classList.remove('bump'); void robot.offsetWidth; robot.classList.add('bump');
      await new Promise(r => setTimeout(r, 350));
      continue;
    }
    pos = { r: nr, c: nc };
    placeRobot(true);
    await new Promise(r => setTimeout(r, 380));
  }
  const ok = pos.r === goal.r && pos.c === goal.c;
  playDing(ok);
  if (ok) {
    score++; streak++; burst();
    statusEl.textContent = 'Yes! 🎉';
    $('#score').textContent = score; $('#streak').textContent = streak;
    setTimeout(newRound, 1300);
  } else {
    streak = 0;
    $('#streak').textContent = streak;
    statusEl.textContent = 'So close! Try again.';
    setTimeout(resetAttempt, 1300);
  }
}

$('#upBtn').onclick = () => queueMove('U');
$('#downBtn').onclick = () => queueMove('D');
$('#leftBtn').onclick = () => queueMove('L');
$('#rightBtn').onclick = () => queueMove('R');
$('#undoBtn').onclick = () => { if (!running) { queue.pop(); renderQueue(); setControlsEnabled(true); } };
$('#clearBtn').onclick = () => { if (!running) { queue = []; renderQueue(); setControlsEnabled(true); } };
$('#goBtn').onclick = runQueue;

window.addEventListener('resize', () => placeRobot(false));

audioCtx = new AudioContext();
master = audioCtx.createGain(); master.gain.value = 0.9; master.connect(audioCtx.destination);
function unlockAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }
document.body.addEventListener('pointerdown', unlockAudio, { once: true });

newRound();
</script>
</body>
</html>
