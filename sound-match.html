<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Match — Becca's Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column;
    align-items: center; gap: 14px; font: 18px/1.4 system-ui, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffd34f, #ff7a4f 55%, #ff6fb0);
    color: #fff; text-align: center; overflow-x: hidden;
  }
  a.back { position: absolute; top: 16px; left: 16px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; }
  h1 { margin: 6px 0 0; font-size: 36px; text-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  #status { font-size: 19px; min-height: 26px; font-weight: 600; }
  .bar { display: flex; gap: 18px; font-weight: 700; font-size: 18px; }
  .stage {
    width: min(520px, 94vw); background: rgba(255,255,255,0.14); border: 4px solid rgba(255,255,255,0.5);
    border-radius: 24px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  #prompt { font-size: 20px; font-weight: 700; }
  .replay {
    font: inherit; font-size: 28px; color: #fff; background: rgba(255,255,255,0.22);
    border: 3px solid rgba(255,255,255,0.6); border-radius: 50%; width: 64px; height: 64px; cursor: pointer;
  }
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; }
  .choice {
    background: #fff; border: 5px solid rgba(255,255,255,0.0); border-radius: 18px; cursor: pointer;
    padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15); transition: transform 0.1s;
  }
  .choice:active { transform: scale(0.96); }
  .choice canvas { width: 100%; height: 70px; background: #0d1b2a; border-radius: 10px; }
  .choice .spk { font-size: 40px; }
  .choice.correct { border-color: #5fcf6a; background: #e9ffe9; }
  .choice.wrong { border-color: #ff5a5a; background: #ffe9e9; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4); flex-direction: column; gap: 14px;
  }
  #overlay.hide { display: none; }
  #overlay .box {
    background: rgba(255,255,255,0.15); border: 4px solid rgba(255,255,255,0.6); border-radius: 24px;
    padding: 28px 36px; text-align: center;
  }
  #overlay button {
    font: inherit; font-weight: 700; font-size: 20px; color: #333; background: #fff;
    border: none; border-radius: 16px; padding: 12px 28px; cursor: pointer; margin-top: 8px;
  }
  .confetti { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.4; } }
  .note { font-size: 13px; opacity: 0.85; max-width: 480px; }
</style>
</head>
<body>
  <a class="back" href="index.html">← Arcade</a>
  <h1>🔊 Sound Match</h1>
  <div id="status">Press Start to hear the first sound.</div>
  <div class="bar"><span>⭐ Score: <span id="score">0</span></span><span>🔥 Streak: <span id="streak">0</span></span></div>

  <div class="stage" id="stage" style="display:none">
    <div id="prompt"></div>
    <div id="replayWrap"></div>
    <div class="choices" id="choices"></div>
  </div>

  <div id="overlay">
    <div class="box">
      <h2>Ready?</h2>
      <div>Water drip, flute, triangle buzz, square buzz — match the sound to its picture, or the picture to its sound!</div>
      <button id="startBtn">🔊 Start</button>
    </div>
  </div>
  <div class="note">All sounds are made right in the browser — nothing to download.</div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), promptEl = $('#prompt'), choicesEl = $('#choices'), replayWrap = $('#replayWrap');
const overlay = $('#overlay'), statusEl = $('#status');
let score = 0, streak = 0, audioCtx, master, busy = false, roundType = 'hear';

// ---------- sound synthesis ----------

function env(g, t0, attack, hold, release, peak) {
  g.gain.cancelScheduledValues(t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + attack);
  g.gain.setValueAtTime(peak, t0 + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + release);
}

function playTone(type, freq) {
  const t0 = audioCtx.currentTime + 0.02;
  const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = audioCtx.createGain();
  if (type === 'sine') {
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 5;
    const lfoAmt = audioCtx.createGain(); lfoAmt.gain.value = 6;
    lfo.connect(lfoAmt); lfoAmt.connect(o.frequency); lfo.start(t0); lfo.stop(t0 + 0.8);
  }
  env(g, t0, 0.05, 0.35, 0.3, type === 'square' ? 0.18 : 0.3);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.75);
}

function playDrip() {
  const t0 = audioCtx.currentTime + 0.02;
  const o = audioCtx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(1200, t0);
  o.frequency.exponentialRampToValueAtTime(350, t0 + 0.13);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.2);
}

function playDing(ok) {
  const t0 = audioCtx.currentTime + 0.02;
  const o = audioCtx.createOscillator(); o.type = 'sine';
  o.frequency.value = ok ? 880 : 180;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (ok ? 0.4 : 0.3));
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.5);
}

const TYPES = [
  { id: 'flute',    label: 'Flute',  play: () => playTone('sine', 440) },
  { id: 'triangle', label: 'Triangle buzz', play: () => playTone('triangle', 260) },
  { id: 'square',   label: 'Square buzz',   play: () => playTone('square', 180) },
  { id: 'drip',     label: 'Water drip', play: () => playDrip() },
];

// ---------- picture drawing ----------

function drawPicture(canvas, id) {
  const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
  canvas.width = Math.max(120, r.width * d); canvas.height = Math.max(60, r.height * d);
  const g = canvas.getContext('2d'), w = canvas.width, h = canvas.height, mid = h / 2;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#7cffb2'; g.lineWidth = 3 * d; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath();
  if (id === 'flute') {
    for (let x = 0; x <= w; x++) g.lineTo(x, mid + Math.sin(x / w * Math.PI * 4) * h * 0.32);
  } else if (id === 'triangle') {
    const cycles = 4, step = w / cycles;
    g.moveTo(0, mid);
    for (let i = 0; i < cycles; i++) {
      g.lineTo(i * step + step * 0.25, mid - h * 0.35);
      g.lineTo(i * step + step * 0.75, mid + h * 0.35);
      g.lineTo((i + 1) * step, mid);
    }
  } else if (id === 'square') {
    const cycles = 4, step = w / cycles;
    g.moveTo(0, mid - h * 0.32);
    for (let i = 0; i < cycles; i++) {
      const x0 = i * step, x1 = x0 + step / 2, x2 = (i + 1) * step;
      g.lineTo(x1, mid - h * 0.32); g.lineTo(x1, mid + h * 0.32); g.lineTo(x2, mid + h * 0.32);
      if (i < cycles - 1) g.lineTo(x2, mid - h * 0.32);
    }
  } else if (id === 'drip') {
    g.moveTo(0, mid);
    g.lineTo(w * 0.12, mid);
    g.lineTo(w * 0.18, mid - h * 0.42);
    g.lineTo(w * 0.26, mid + h * 0.1);
    g.lineTo(w * 0.34, mid - h * 0.12);
    g.lineTo(w * 0.42, mid);
    for (let x = w * 0.42; x <= w; x++) g.lineTo(x, mid);
  }
  g.stroke();
}

// ---------- round logic ----------

function nextRound() {
  busy = false;
  roundType = Math.random() < 0.5 ? 'hear' : 'see';
  const order = shuffle(TYPES.slice());
  const target = order[0];

  choicesEl.innerHTML = '';
  if (roundType === 'hear') {
    promptEl.textContent = 'Which picture matches the sound?';
    replayWrap.innerHTML = `<button class="replay" id="replayBtn">🔊</button>`;
    $('#replayBtn').onclick = () => target.play();
    order.forEach(t => {
      const el = document.createElement('div');
      el.className = 'choice';
      el.dataset.id = t.id;
      el.innerHTML = `<canvas></canvas>`;
      el.onclick = () => choose(el, t, target);
      choicesEl.appendChild(el);
      drawPicture(el.querySelector('canvas'), t.id);
    });
    setTimeout(() => target.play(), 300);
  } else {
    promptEl.textContent = 'Which sound matches this picture?';
    const pic = document.createElement('canvas');
    pic.style.width = '220px'; pic.style.height = '90px'; pic.style.background = '#0d1b2a'; pic.style.borderRadius = '10px';
    replayWrap.innerHTML = ''; replayWrap.appendChild(pic);
    drawPicture(pic, target.id);
    order.forEach(t => {
      const el = document.createElement('div');
      el.className = 'choice';
      el.dataset.id = t.id;
      el.innerHTML = `<div class="spk">🔊</div>`;
      el.onclick = () => choose(el, t, target);
      choicesEl.appendChild(el);
    });
  }
  statusEl.textContent = '';
}

function choose(el, picked, target) {
  if (busy) return;
  busy = true;
  const ok = picked.id === target.id;
  const settle = () => {
    el.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) {
      [...choicesEl.children].forEach(c => { if (c.dataset.id === target.id) c.classList.add('correct'); });
    }
    playDing(ok);
    if (ok) { score++; streak++; burst(); } else { streak = 0; }
    $('#score').textContent = score; $('#streak').textContent = streak;
    statusEl.textContent = ok ? 'Yes! 🎉' : 'Close — listen again next time!';
    setTimeout(nextRound, 1300);
  };
  if (roundType === 'see') {
    picked.play();
    setTimeout(settle, 550);
  } else {
    settle();
  }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function burst() {
  for (let i = 0; i < 10; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = ['⭐','✨','🎉'][i % 3];
    c.style.left = (40 + Math.random() * 20) + 'vw';
    c.style.animationDuration = (1.4 + Math.random()) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

$('#startBtn').onclick = () => {
  audioCtx = new AudioContext();
  master = audioCtx.createGain(); master.gain.value = 0.9; master.connect(audioCtx.destination);
  overlay.classList.add('hide');
  stage.style.display = 'flex';
  nextRound();
};
</script>
</body>
</html>
