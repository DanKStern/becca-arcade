<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match — Becca's Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column;
    align-items: center; gap: 16px; font: 18px/1.4 system-ui, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #4fd1ff, #7c6bff 50%, #ff6fb0);
    color: #fff; text-align: center; overflow-x: hidden;
  }
  a.back { position: absolute; top: 16px; left: 16px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; }
  h1 { margin: 6px 0 0; font-size: 36px; text-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .bar { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 20px; flex-wrap: wrap; justify-content: center; }
  .bar button {
    font: inherit; font-weight: 700; font-size: 16px; color: #fff; background: rgba(255,255,255,0.22);
    border: 3px solid rgba(255,255,255,0.6); border-radius: 14px; padding: 8px 16px; cursor: pointer;
  }
  .bar button.active { background: rgba(255,255,255,0.5); }
  #grid {
    display: grid; gap: 10px; margin-top: 4px;
    grid-template-columns: repeat(var(--cols), 1fr);
    width: min(560px, 94vw);
  }
  .card {
    position: relative; aspect-ratio: 3/4; cursor: pointer; perspective: 600px;
  }
  .card .inner {
    position: absolute; inset: 0; transition: transform 0.35s; transform-style: preserve-3d;
  }
  .card.flip .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .back-face { background: linear-gradient(160deg, #ffd34f, #ff7a4f); }
  .back-face::after { content: "?"; font-size: 32px; font-weight: 800; color: rgba(255,255,255,0.85); }
  .front-face { background: #fff; color: #333; transform: rotateY(180deg); }
  .card.matched .front-face { background: #d6ffd6; animation: pulse 0.4s ease; }
  @keyframes pulse { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); flex-direction: column; gap: 14px;
  }
  #overlay.show { display: flex; }
  #overlay .box {
    background: rgba(255,255,255,0.15); border: 4px solid rgba(255,255,255,0.6); border-radius: 24px;
    padding: 32px 40px; text-align: center;
  }
  #overlay h2 { font-size: 40px; margin: 0 0 8px; }
  #overlay button {
    font: inherit; font-weight: 700; font-size: 20px; color: #333; background: #fff;
    border: none; border-radius: 16px; padding: 12px 28px; cursor: pointer; margin-top: 10px;
  }
  .confetti { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.4; } }
</style>
</head>
<body>
  <a class="back" href="index.html">← Arcade</a>
  <h1>🧠 Memory Match</h1>
  <div class="bar">
    <button id="easyBtn" class="active">Easy (20)</button>
    <button id="hardBtn">Hard (30)</button>
    <span id="stats">Matches: 0/0 · Moves: 0</span>
  </div>
  <div id="grid"></div>

  <div id="overlay">
    <div class="box">
      <h2>🎉 You Win!</h2>
      <div id="winStats"></div>
      <button id="againBtn">Play Again</button>
    </div>
  </div>

<script>
const ALL_EMOJI = ['🐶','🐱','🦁','🐸','🐵','🦋','🐠','🦄','🐢','🐘','🦊','🐧','🐻','🐼','🐷','🦓'];
const $ = s => document.querySelector(s);
const grid = $('#grid'), stats = $('#stats'), overlay = $('#overlay');

let cols = 4, cards = [], flipped = [], matchedCount = 0, moves = 0, busy = false;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setup(pairCount) {
  overlay.classList.remove('show');
  cols = pairCount === 10 ? 4 : 5; // 20 cards -> 4x5, 30 cards -> 5x6
  const rows = (pairCount * 2) / cols;
  grid.style.setProperty('--cols', cols);
  const picks = shuffle(ALL_EMOJI.slice()).slice(0, pairCount);
  const deck = shuffle(picks.concat(picks));
  flipped = []; matchedCount = 0; moves = 0; busy = false;
  grid.innerHTML = '';
  cards = deck.map((emo, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="inner">
      <div class="face back-face"></div>
      <div class="face front-face">${emo}</div>
    </div>`;
    el.onclick = () => onCard(i);
    grid.appendChild(el);
    return { emo, el, matched: false };
  });
  updateStats(pairCount);
}

function updateStats(totalPairs) {
  stats.textContent = `Matches: ${matchedCount}/${totalPairs} · Moves: ${moves}`;
}

function onCard(i) {
  if (busy) return;
  const c = cards[i];
  if (c.matched || c.el.classList.contains('flip')) return;
  c.el.classList.add('flip');
  flipped.push(i);
  if (flipped.length === 2) {
    moves++;
    busy = true;
    const [a, b] = flipped;
    if (cards[a].emo === cards[b].emo) {
      cards[a].matched = cards[b].matched = true;
      cards[a].el.classList.add('matched');
      cards[b].el.classList.add('matched');
      matchedCount++;
      flipped = []; busy = false;
      const totalPairs = cards.length / 2;
      updateStats(totalPairs);
      if (matchedCount === totalPairs) setTimeout(() => win(), 400);
    } else {
      updateStats(cards.length / 2);
      setTimeout(() => {
        cards[a].el.classList.remove('flip');
        cards[b].el.classList.remove('flip');
        flipped = []; busy = false;
      }, 800);
    }
  }
}

function win() {
  $('#winStats').textContent = `Finished in ${moves} moves!`;
  overlay.classList.add('show');
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = ['🎉','⭐','🎈','✨'][i % 4];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

$('#easyBtn').onclick = () => { $('#easyBtn').classList.add('active'); $('#hardBtn').classList.remove('active'); setup(10); };
$('#hardBtn').onclick = () => { $('#hardBtn').classList.add('active'); $('#easyBtn').classList.remove('active'); setup(15); };
$('#againBtn').onclick = () => setup($('#hardBtn').classList.contains('active') ? 15 : 10);

setup(10);
</script>
</body>
</html>
